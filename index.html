      content="Octiq Enterprise — Flow A: Employee Management UI — modern web application"
    />
    <meta property="og:site_name" content="Octiq Enterprise — Flow A: Employee Management UI" />
    <!--
      FOUC prevention — runs before React hydrates.
      Reads the stored theme and sets class="dark" on <html> synchronously
      so the first paint matches the user's preference with no flicker.
    -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('ui-theme')
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
